name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # release.yml installs with poetry, but CI does not, so a poetry.lock
  # that no longer matches pyproject.toml is undetectable until a
  # release runs — and the tag is public by then. The same gap turned a
  # sibling package's release red at its first step.
  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The core library this server wraps is not yet published to PyPI, so it
      # cannot be hash-pinned in requirements/test.txt. Install it unpinned
      # from source; replace this step with the hash-pinned line in test.in
      # once structured-address-fix ships to PyPI.

      # Hash-pinned install (supply-chain hardening). The local package itself
      # is imported via ``python -m pytest`` (repo root on sys.path) so no
      # unpinnable ``pip install -e .`` is required.
      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements/test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_tool_dispatch.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml structured_address_fix_mcp

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Unpinned until the core ships to PyPI; mypy --strict needs the core's
      # types resolvable. See the test job for the rationale.

      - name: Install lint tools (hash-pinned)
        run: pip install --require-hashes -r requirements/lint.txt

      - name: Ruff check
        run: ruff check structured_address_fix_mcp/ benches/ scripts/

      - name: Black check
        run: black --check structured_address_fix_mcp/ tests/ benches/ scripts/

      - name: Mypy
        run: mypy structured_address_fix_mcp/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install bandit (hash-pinned)
        run: pip install --require-hashes -r requirements/security.txt
      - name: Bandit
        run: bandit -r structured_address_fix_mcp/ -ll
