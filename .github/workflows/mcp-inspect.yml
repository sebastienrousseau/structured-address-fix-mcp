name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The core library this server wraps is not yet on PyPI, so ``pip
      # install .`` cannot resolve it from the published index. Install it
      # unpinned from source first; drop this step once the core ships.

      - name: Install structured-address-fix-mcp
        run: pip install .

      - name: List tools via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli structured-address-fix-mcp --method tools/list

      - name: Serve streamable HTTP and SSE in the background
        run: |
          structured-address-fix-mcp --transport streamable-http --port 8000 &
          structured-address-fix-mcp --transport sse --port 8001 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8000/mcp \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{}' && break
            sleep 1
          done

      - name: List tools over streamable HTTP via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli http://127.0.0.1:8000/mcp --transport http --method tools/list

      - name: List tools over SSE via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli http://127.0.0.1:8001/sse --transport sse --method tools/list
